
name: Test AWS OIDC Authentication

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC Subject
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("OIDC audience:", claims["aud"])
          print("OIDC subject:", claims["sub"])
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Verify Region
        run: echo "AWS Region is $AWS_REGION"

      - name: Success Message
        run: echo "GitHub Actions successfully authenticated to AWS!"
